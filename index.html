<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assignment 5 | Web Development</title>

    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .con {
            height: 520px;
            width: 80%;

            display: flex;
            align-items: center;
        }

        .box {
            height: 100%;
            width: 320px;
        }
        
        .b1 {
            width: 2%;
            background-color: navy;
            border-radius: 10px;
        }
        
        .b2 {
            width: 65%;
            display: flex;
            align-items: center;
        }
        .b2 h1 {
            font-size: 118px;
            font-weight: bold;
            color: navy;
        }
        
        .b3 {
            width: 38%;
            box-shadow: 0px 0px 10px 5px rgba(0, 0, 0, 0.3);
                        /* 2px -2px 5px 1px rgba(0, 0, 0, 0.3); */
            border-radius: 20px;
            overflow: hidden;

            display: flex;
            flex-direction: column;
        }

        .b3 .top {
            background-color:dodgerblue;
            background-color:;
            width: 100%;
            height: 30%;

            position: relative;
        }

        .top .circle {
            width: 120px;
            height: 120px;
            background-color: white;
            border: 2px solid black;
            border-radius: 50%;

            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle img {
            border-radius: 50%;
            width: 100px;
            height: 100px;
            object-fit: cover;

        }

        .b3 .bottom {
            width: 100%;
            height: 70%;
            text-align: center;
            padding: 20px 0px;
        }
        .b3 h1 {
            margin-top: 20px;
        }
        .b3 .logos {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .bottom .buttons {
            display: flex;
            margin: 10px 0;
            padding: 10px;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        button {
            width: 160px;
            padding: 10px 12px;
            font-size: 18px;
            border-radius: 30px;
            border: none;
            background-color:dodgerblue;
            color: white;
            font-weight: 600;
        }
        .stats {
            padding: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 100px;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box b1"></div>
        <div class="box b2">
            <h1>Profile Card UI/UX Design</h1>  
        </div>
        <div class="box b3">
            <div class="top">
                <div class="circle">
                    <img src="img2.jpg" alt="">
                </div>
            </div>
            <div class="bottom">
                <h1>Software Developer</h2>
                <h2>Dezyne École College</h3>
                <div class="logos">
                    <h1 class="fa fa-brands fa-facebook" style="color: blue;"></h1>
                    <h1 class="fa fa-brands fa-twitter" style="color: cyan;"></h1>
                    <h1 class="fa fa-brands fa-instagram" style="color:palevioletred;"></h1>
                    <h1 class="fa fa-brands fa-youtube" style="color: red;"></h1>
                </div>
                <div class="buttons">
                    <button>Subscribe</button>
                    <button>Message</button>
                </div>
                <div class="stats">
                    <h2 class="fa fa-solid fa-heart">20k</h2>
                    <h2 class="fa fa-solid fa-comment">20k</h2>
                    <h2 class="fa fa-solid fa-share">20k</h2>
                </div>
            </div>
        </div>
    </div>
</body>
